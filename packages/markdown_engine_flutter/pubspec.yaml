name: markdown_engine_flutter
description: Flutter MarkdownView widget with lazy slivers, OpenType TeX math, vector Mermaid diagrams, HTML tables, selection, and streaming.
version: 0.2.1
homepage: https://tkinnis.github.io/markdown_engine/
repository: https://github.com/tkinnis/markdown_engine/tree/main/packages/markdown_engine_flutter
issue_tracker: https://github.com/tkinnis/markdown_engine/issues
documentation: https://tkinnis.github.io/markdown_engine/

topics:
  - markdown
  - commonmark
  - gfm
  - widget
  - streaming

screenshots:
  - description: 'Light-theme MarkdownView rendering headings, alerts, task lists, tables, TeX math, Mermaid diagrams, and HTML keycaps.'
    path: screenshots/showcase_light.png
  - description: 'Dark-theme MarkdownView rendering headings, alerts, task lists, tables, TeX math, Mermaid diagrams, and HTML keycaps.'
    path: screenshots/showcase_dark.png
  - description: 'Native HTML tables with keycaps, description lists, expanded details disclosures, and inline HTML typography.'
    path: screenshots/html_and_disclosures.png

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  markdown_engine: ^0.2.1
  pele_dart: ^1.13.0+1
  tex_math_flutter: ^0.1.0
  vector_graphics: ^1.2.6
  vector_graphics_compiler: ^1.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
