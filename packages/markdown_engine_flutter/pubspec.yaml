version: 0.1.0
homepage: https://tkinnis.github.io/markdown_engine/
repository: https://github.com/tkinnis/markdown_engine/tree/main/packages/markdown_engine_flutter
issue_tracker: https://github.com/tkinnis/markdown_engine/issues
