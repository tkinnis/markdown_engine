name: markdown_engine
description: Pure-Dart CommonMark 0.31.2 and GitHub Flavored Markdown parser, AST, HTML/text/JSON exporters, and streaming incremental engine.
version: 0.2.0
homepage: https://tkinnis.github.io/markdown_engine/
repository: https://github.com/tkinnis/markdown_engine/tree/main/packages/markdown_engine
issue_tracker: https://github.com/tkinnis/markdown_engine/issues
documentation: https://tkinnis.github.io/markdown_engine/

topics:
  - markdown
  - commonmark
  - gfm
  - parser
  - ast

screenshots:
  - description: 'Light-mode pipeline overview of MarkdownEngine parsing CommonMark/GFM source into a sealed AST and HTML.'
    path: screenshots/showcase_light.png
  - description: 'Dark-mode pipeline overview of MarkdownEngine parsing CommonMark/GFM source into a sealed AST and HTML.'
    path: screenshots/showcase_dark.png

resolution: workspace

environment:
  sdk: ^3.8.0

dependencies:
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.27.0
