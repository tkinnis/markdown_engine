name: markdown_engine_compare
description: Standalone comparison benchmark package for markdown_engine vs Dart and Flutter Markdown packages.
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_md: ^0.3.1
  markdown: ^7.3.1
  markdown_engine:
    path: ../../packages/markdown_engine
  markdown_engine_flutter:
    path: ../../packages/markdown_engine_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

dependency_overrides:
  markdown_engine:
    path: ../../packages/markdown_engine
