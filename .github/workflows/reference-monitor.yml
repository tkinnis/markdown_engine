name: Reference Release Monitor

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-reference:
    name: Check CommonMark & cmark-gfm Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter & Dart SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Check upstream CommonMark and cmark-gfm releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dart run tool/sync_reference.dart --check --json > reference_status.json
          cat reference_status.json

          HAS_UPDATE=$(jq -r '.hasUpdate' reference_status.json)
          PINNED_COMMONMARK=$(jq -r '.pinnedCommonmark' reference_status.json)
          LATEST_COMMONMARK=$(jq -r '.latestCommonmark' reference_status.json)
          PINNED_GFM=$(jq -r '.pinnedGfm' reference_status.json)
          LATEST_GFM=$(jq -r '.latestGfm' reference_status.json)

          if [ "$HAS_UPDATE" != "true" ]; then
            echo "Reference pins match upstream releases (commonmark=$PINNED_COMMONMARK, cmark-gfm=$PINNED_GFM)."
            exit 0
          fi

          ISSUE_TITLE="chore(reference): sync commonmark ${LATEST_COMMONMARK} / cmark-gfm ${LATEST_GFM}"
          EXISTING_COUNT=$(gh issue list --state open --search "\"${ISSUE_TITLE}\" in:title" --json number --jq 'length')

          if [ "$EXISTING_COUNT" != "0" ]; then
            echo "Open tracking issue for ${ISSUE_TITLE} already exists; skipping duplicate creation."
            exit 0
          fi

          {
            echo "## Reference Update Detected"
            echo ""
            echo "| Specification | Pinned | Latest |"
            echo "| :--- | :--- | :--- |"
            echo "| \`commonmark/commonmark-spec\` | \`${PINNED_COMMONMARK}\` | \`${LATEST_COMMONMARK}\` |"
            echo "| \`github/cmark-gfm\` | \`${PINNED_GFM}\` | \`${LATEST_GFM}\` |"
            echo ""
            echo "### Sync Instructions"
            echo ""
            echo "Follow [\`doc/REFERENCE_SYNC.md\`](doc/REFERENCE_SYNC.md) and [\`.agents/skills/sync-reference-commonmark/SKILL.md\`](.agents/skills/sync-reference-commonmark/SKILL.md) to refresh vendored fixtures under \`corpus/spec/\`, update \`REFERENCE.md\` digests, regenerate \`doc/COVERAGE.md\` and \`doc/BENCHMARKS.md\`, and verify all workspace quality gates."
          } > issue_body.md

          gh issue create \
            --title "$ISSUE_TITLE" \
            --label "enhancement" \
            --body-file issue_body.md
